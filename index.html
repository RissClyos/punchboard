<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#CDBFA3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Punchboard" />
<title>Punchboard — what are we playing tonight?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#CDBFA3; --boardDark:#B3A184; --ink:#211C15; --inkSoft:#5C5343;
    --red:#C2352C; --blue:#1D5F8A; --yellow:#DFA028; --green:#3D7345; --cream:#EDE5D4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board); color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    padding-bottom:calc(48px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:940px;margin:0 auto;padding:0 18px;}
  .display{font-family:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;}
  header{padding:34px 0 22px;}
  h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:clamp(34px,7vw,58px);line-height:.95;margin:0;font-weight:800;}
  .dots{display:flex;gap:5px;margin-bottom:14px;}
  .dots span{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 -2px 3px rgba(0,0,0,.3);}
  .sub{max-width:460px;margin-top:14px;color:var(--inkSoft);font-size:15px;line-height:1.5;}
  .controls{display:flex;flex-wrap:wrap;gap:22px;padding:18px 0 22px;border-top:2px solid rgba(33,28,21,.25);border-bottom:2px solid rgba(33,28,21,.25);}
  .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--inkSoft);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .chip{font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid rgba(33,28,21,.35);background:transparent;color:var(--inkSoft);border-radius:999px;padding:6px 12px;transition:all .14s ease;}
  .chip:hover{border-color:var(--ink);color:var(--ink);}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--cream);}
  .pickrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:22px 0;}
  .btn{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px;background:var(--red);color:var(--cream);border:none;border-radius:3px;padding:14px 22px;cursor:pointer;box-shadow:0 4px 0 #8E2019;transition:transform .1s ease,box-shadow .1s ease;}
  .btn:hover:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #8E2019;}
  .btn:disabled{background:var(--inkSoft);box-shadow:0 4px 0 rgba(33,28,21,.4);cursor:not-allowed;opacity:.6;}
  #result{min-height:30px;}
  #pickName{font-size:26px;font-weight:800;line-height:1.1;}
  .sheet{background:var(--boardDark);border-radius:4px;padding:14px;box-shadow:inset 0 0 0 2px rgba(33,28,21,.18);display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));}
  .tile{position:relative;border:none;border-radius:3px;padding:12px 12px 10px;color:var(--ink);transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease,filter .18s ease;}
  .tile.up{background:var(--cream);box-shadow:0 4px 0 rgba(33,28,21,.45),0 6px 12px rgba(33,28,21,.22);transform:translateY(-3px);}
  .tile.up:hover{transform:translateY(-6px);box-shadow:0 7px 0 rgba(33,28,21,.45),0 10px 18px rgba(33,28,21,.25);}
  .tile.down{background:var(--boardDark);box-shadow:inset 0 2px 5px rgba(33,28,21,.5),inset 0 0 0 1px rgba(33,28,21,.3);opacity:.5;filter:saturate(.4);transform:translateY(2px);}
  .tile.hit{outline:3px solid var(--red);outline-offset:2px;}
  .tile h3{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:600;line-height:1.15;margin:0 0 8px;}
  .meta{font-size:12px;color:var(--inkSoft);font-weight:500;}
  .pips{display:flex;gap:3px;margin-bottom:8px;}
  .pips i{width:6px;height:6px;border-radius:50%;display:block;}
  .x{position:absolute;top:6px;right:6px;border:none;background:transparent;color:var(--inkSoft);cursor:pointer;font-size:15px;line-height:1;padding:3px 5px;border-radius:3px;opacity:0;transition:opacity .15s;}
  .tile.up:hover .x,.x:focus{opacity:1;}
  .x:hover{background:rgba(194,53,44,.15);color:var(--red);}
  .panel{background:var(--cream);border-radius:3px;padding:16px;box-shadow:0 3px 0 rgba(33,28,21,.35);margin-top:22px;}
  .in{font-family:inherit;font-size:16px;width:100%;background:#fff;color:var(--ink);border:1.5px solid rgba(33,28,21,.3);border-radius:3px;padding:9px 10px;}
  .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin-top:10px;}
  .in:focus,.chip:focus-visible,.btn:focus-visible,.x:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  footer{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .warn{font-size:13px;color:var(--red);margin-top:12px;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dots">
      <span style="background:var(--red)"></span><span style="background:var(--blue)"></span>
      <span style="background:var(--yellow)"></span><span style="background:var(--green)"></span>
    </div>
    <h1>What are we<br>playing tonight?</h1>
    <p class="sub">Set who's here and how long you've got. Games that don't fit press back into the sheet.</p>
  </header>

  <section class="controls">
    <div><div class="label">Players</div><div class="chips" id="playerChips"></div></div>
    <div><div class="label">Time</div><div class="chips" id="timeChips"></div></div>
    <div><div class="label">Brain</div><div class="chips" id="weightChips"></div></div>
  </section>

  <section class="pickrow">
    <button class="btn" id="punch">Punch one out</button>
    <div id="result"><div class="meta" id="count"></div></div>
  </section>

  <div class="sheet" id="sheet"></div>

  <section>
    <button class="chip" id="showAdd" style="margin-top:22px">+ Add a game</button>
    <div class="panel" id="addPanel" hidden>
      <div class="label">New game</div>
      <input class="in" id="gName" placeholder="Game name" style="margin-top:10px" />
      <div class="grid4">
        <div><div class="label" style="font-size:10px">Min players</div><input class="in" id="gMin" type="number" value="2" inputmode="numeric" /></div>
        <div><div class="label" style="font-size:10px">Max players</div><input class="in" id="gMax" type="number" value="4" inputmode="numeric" /></div>
        <div><div class="label" style="font-size:10px">Minutes</div><input class="in" id="gTime" type="number" value="45" inputmode="numeric" /></div>
        <div><div class="label" style="font-size:10px">Brain 1–5</div><input class="in" id="gWeight" type="number" value="2" min="1" max="5" inputmode="numeric" /></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn" id="saveGame" style="font-size:14px;padding:10px 18px">Add to shelf</button>
        <button class="chip" id="cancelAdd">Cancel</button>
      </div>
    </div>
    <p class="warn" id="warn" hidden>This browser won't let the shelf save, so it resets on reload. Use Back up shelf to keep a copy.</p>
  </section>

  <footer>
    <button class="chip" id="exportBtn">Back up shelf</button>
    <button class="chip" id="importBtn">Restore backup</button>
    <input type="file" id="importFile" accept="application/json" hidden />
    <span class="meta" id="saveState"></span>
  </footer>
</div>

<script>
const KEY = "punchboard.collection.v1";
const TOKENS = ["#C2352C","#1D5F8A","#DFA028","#3D7345"];
const SEED = [
  {id:"s1",name:"Azul",min:2,max:4,time:40,weight:2},
  {id:"s2",name:"Wingspan",min:1,max:5,time:70,weight:3},
  {id:"s3",name:"Codenames",min:4,max:8,time:15,weight:1},
  {id:"s4",name:"Ticket to Ride",min:2,max:5,time:60,weight:2},
  {id:"s5",name:"Brass: Birmingham",min:2,max:4,time:120,weight:4},
  {id:"s6",name:"The Crew",min:2,max:5,time:20,weight:2},
  {id:"s7",name:"Splendor",min:2,max:4,time:30,weight:2},
  {id:"s8",name:"Gloomhaven",min:1,max:4,time:120,weight:4},
  {id:"s9",name:"Just One",min:3,max:7,time:20,weight:1},
  {id:"s10",name:"Terraforming Mars",min:1,max:5,time:120,weight:4}
];
const TIMES = [{v:0,l:"Any"},{v:30,l:"30 min"},{v:60,l:"1 hr"},{v:90,l:"90 min"}];
const WEIGHTS = [
  {v:"any",l:"Any",t:()=>true},
  {v:"light",l:"Light",t:w=>w<=2},
  {v:"mid",l:"Medium",t:w=>w===3},
  {v:"heavy",l:"Heavy",t:w=>w>=4}
];

let canSave = true;
function load(){
  try{ const raw = localStorage.getItem(KEY); const p = raw && JSON.parse(raw);
    if(Array.isArray(p) && p.length) return p; }
  catch(e){ canSave = false; }
  return SEED.slice();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(games)); mark("Saved"); }
  catch(e){ canSave = false; document.getElementById("warn").hidden = false; mark(""); }
}
function mark(t){
  const el = document.getElementById("saveState");
  el.textContent = t;
  if(t){ clearTimeout(mark._t); mark._t = setTimeout(()=>{el.textContent="";},1600); }
}

let games = load();
let players = 4, maxTime = 0, weight = "any", picked = null;
if(!canSave) document.getElementById("warn").hidden = false;

const fits = g => players>=g.min && players<=g.max
  && (!maxTime || g.time<=maxTime)
  && WEIGHTS.find(w=>w.v===weight).t(g.weight);

function chips(host, items, current, onPick){
  host.innerHTML = "";
  items.forEach(it=>{
    const b = document.createElement("button");
    b.className = "chip" + (it.v===current ? " on" : "");
    b.textContent = it.l;
    b.onclick = ()=>{ onPick(it.v); render(); };
    host.appendChild(b);
  });
}

function render(){
  chips(document.getElementById("playerChips"),
    [2,3,4,5,6,7,8].map(n=>({v:n,l:String(n)})), players, v=>{players=v;});
  chips(document.getElementById("timeChips"), TIMES, maxTime, v=>{maxTime=v;});
  chips(document.getElementById("weightChips"), WEIGHTS, weight, v=>{weight=v;});

  const sheet = document.getElementById("sheet");
  sheet.innerHTML = "";
  games.forEach(g=>{
    const ok = fits(g);
    const el = document.createElement("div");
    el.className = "tile " + (ok?"up":"down") + (picked && picked.id===g.id ? " hit":"");
    const pips = Array.from({length:g.weight},(_,i)=>
      `<i style="background:${ok?TOKENS[i%4]:'rgba(33,28,21,.35)'}"></i>`).join("");
    el.innerHTML = `
      ${ok?`<button class="x" aria-label="Remove ${g.name}">✕</button>`:""}
      <div class="pips">${pips}</div>
      <h3>${g.name.replace(/</g,"&lt;")}</h3>
      <div class="meta">${g.min===g.max?g.min:g.min+"–"+g.max} players · ${g.time} min</div>`;
    const x = el.querySelector(".x");
    if(x) x.onclick = ()=>{
      games = games.filter(o=>o.id!==g.id);
      if(picked && picked.id===g.id) picked=null;
      save(); render();
    };
    sheet.appendChild(el);
  });

  const matches = games.filter(fits);
  document.getElementById("punch").disabled = !matches.length;
  const res = document.getElementById("result");
  res.innerHTML = picked
    ? `<div class="label">Tonight</div><div class="display" id="pickName">${picked.name.replace(/</g,"&lt;")}</div>`
    : `<div class="meta">${matches.length} of ${games.length} fit right now.</div>`;
}

document.getElementById("punch").onclick = ()=>{
  const m = games.filter(fits);
  if(!m.length) return;
  const btn = document.getElementById("punch");
  btn.disabled = true; btn.textContent = "Punching…";
  let n = 0;
  const tick = setInterval(()=>{
    picked = m[Math.floor(Math.random()*m.length)];
    render();
    document.getElementById("punch").disabled = true;
    document.getElementById("punch").textContent = "Punching…";
    if(++n>9){
      clearInterval(tick);
      document.getElementById("punch").textContent = "Punch one out";
      render();
    }
  },70);
};

document.getElementById("showAdd").onclick = ()=>{
  document.getElementById("addPanel").hidden = false;
  document.getElementById("showAdd").hidden = true;
  document.getElementById("gName").focus();
};
document.getElementById("cancelAdd").onclick = ()=>{
  document.getElementById("addPanel").hidden = true;
  document.getElementById("showAdd").hidden = false;
};
document.getElementById("saveGame").onclick = ()=>{
  const name = document.getElementById("gName").value.trim();
  if(!name){ document.getElementById("gName").focus(); return; }
  const min = Math.max(1, +document.getElementById("gMin").value || 1);
  const max = Math.max(min, +document.getElementById("gMax").value || min);
  games.push({
    id:"u"+Date.now(), name, min, max,
    time: Math.max(5, +document.getElementById("gTime").value || 30),
    weight: Math.min(5, Math.max(1, +document.getElementById("gWeight").value || 2))
  });
  save();
  document.getElementById("gName").value = "";
  document.getElementById("addPanel").hidden = true;
  document.getElementById("showAdd").hidden = false;
  render();
};

document.getElementById("exportBtn").onclick = ()=>{
  const blob = new Blob([JSON.stringify(games,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "punchboard-shelf.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick = ()=> document.getElementById("importFile").click();
document.getElementById("importFile").onchange = e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const p = JSON.parse(r.result);
      if(!Array.isArray(p)) throw new Error("bad");
      games = p; picked = null; save(); render();
    }catch{ alert("That file isn't a Punchboard backup. Pick the punchboard-shelf.json file you saved."); }
  };
  r.readAsText(f);
  e.target.value = "";
};

render();
</script>
</body>
</html>
